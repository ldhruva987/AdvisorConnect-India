server:
  port: 7187

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.advisorconnect.*"
  mail:
    host: ${SPRING_MAIL_HOST:smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jpa:
    hibernate:
      # Matches every other service's docker profile. The base profile ships `validate`, which
      # was harmless while this service had no entities at all; now that `notifications` exists
      # and the compose stack has no migration step, validate would fail startup against an
      # empty notification_db.
      ddl-auto: update

mail:
  from: ${MAIL_FROM:noreply@advisorconnect.io}

logging:
  level:
    com.advisorconnect: INFO
