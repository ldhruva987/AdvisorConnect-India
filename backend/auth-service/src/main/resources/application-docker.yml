server:
  port: 7181

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:7432/auth_db
    username: ${POSTGRES_USER:acadmin}
    password: ${POSTGRES_PASSWORD:acpassword}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:7379}
      password: ${REDIS_PASSWORD:acredispass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

jwt:
  secret: ${JWT_SECRET}

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}

logging:
  level:
    com.advisorconnect: INFO
    org.springframework.security: WARN
