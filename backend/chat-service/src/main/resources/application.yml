server:
  port: 8085

spring:
  application:
    name: chat-service
  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    # Must match the keyspace created by scripts/cassandra/init.cql.
    keyspace-name: ${CASSANDRA_KEYSPACE:chat_service}
    local-datacenter: datacenter1
    schema-action: create-if-not-exists
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Required by JwtConfig: the WebSocket handshake verifies tokens itself rather than
# trusting gateway-injected headers, so this must be byte-identical to auth-service's
# signing secret. Default mirrors auth-service's for local development only.
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-enough}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
