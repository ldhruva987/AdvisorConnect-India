server:
  port: 7186

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:7432/admin_db
    username: ${POSTGRES_USER:acadmin}
    password: ${POSTGRES_PASSWORD:acpassword}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: admin-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

logging:
  level:
    com.advisorconnect: INFO
