# ─── API Gateway — LoadBalancer (public entry point) ─────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: advisorconnect-prod
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: advisorconnect
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
---
# ─── Frontend — ClusterIP (served via Ingress) ───────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: advisorconnect-prod
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
# ─── Backend services — ClusterIP (internal only) ────────────────────────────
