apiVersion: v1
kind: ServiceAccount
metadata:
  name: ac-service-account
  namespace: advisorconnect-prod
  labels:
    app.kubernetes.io/part-of: advisorconnect
---
# Minimal role — services only need to read their own ConfigMaps/Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ac-service-role
  namespace: advisorconnect-prod
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ac-service-role-binding
  namespace: advisorconnect-prod
subjects:
  - kind: ServiceAccount
    name: ac-service-account
    namespace: advisorconnect-prod
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ac-service-role
