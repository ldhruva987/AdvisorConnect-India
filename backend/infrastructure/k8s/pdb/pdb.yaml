# ─── PodDisruptionBudgets ─────────────────────────────────────────────────────
# Ensures at least 1 pod stays alive during voluntary disruptions
# (node drain, rolling upgrade, cluster maintenance).

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: advisorconnect-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: advisorconnect-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
---
