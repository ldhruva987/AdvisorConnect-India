# ─── KEDA ScaledObject — notification-service (Kafka-driven scaling) ─────────
# Requires: KEDA installed — https://keda.sh/docs/latest/deploy/
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-scaledobject
  namespace: advisorconnect-prod
spec:
  scaleTargetRef:
    name: notification-service
  pollingInterval: 15
  cooldownPeriod:  60
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.advisorconnect-infra.svc.cluster.local:9092
        consumerGroup: notification-service-group
        topic: booking.created
        lagThreshold: "10"
    - type: kafka
      metadata:
        bootstrapServers: kafka.advisorconnect-infra.svc.cluster.local:9092
        consumerGroup: notification-service-group
        topic: advisor.approved
        lagThreshold: "10"
