apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: advisorconnect-prod
  labels:
    app: chat-service
    app.kubernetes.io/part-of: advisorconnect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      imagePullSecrets:
        - name: ac-registry-secret
      terminationGracePeriodSeconds: 60   # longer for WebSocket drain
      containers:
        - name: chat-service
          image: your-registry/ac-chat-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: ac-common-config
            - configMapRef:
                name: ac-chat-service-config
          env:
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ac-app-secrets
                  key: CASSANDRA_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60      # Cassandra connection warm-up
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: chat-service
                topologyKey: kubernetes.io/hostname
