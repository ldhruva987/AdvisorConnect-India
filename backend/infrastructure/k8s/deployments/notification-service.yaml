apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: advisorconnect-prod
  labels:
    app: notification-service
    app.kubernetes.io/part-of: advisorconnect
spec:
  replicas: 1          # single consumer replica; scale via KEDA if needed
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: ac-registry-secret
      terminationGracePeriodSeconds: 45
      containers:
        - name: notification-service
          image: your-registry/ac-notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: ac-common-config
            - configMapRef:
                name: ac-notification-service-config
          env:
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ac-app-secrets
                  key: MAIL_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ac-app-secrets
                  key: MAIL_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 15
            periodSeconds: 10
