apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: advisorconnect-prod
  labels:
    app: admin-service
    app.kubernetes.io/part-of: advisorconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      imagePullSecrets:
        - name: ac-registry-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: admin-service
          image: your-registry/ac-admin-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: ac-common-config
            - configMapRef:
                name: ac-admin-service-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ac-app-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
