server:
  port: 7180

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:7181
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://user-service:7182
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            # Mirrors the local profile. Rate limiting existed only in local dev, so the
            # deployed gateway — the one actually exposed to the internet — was the single
            # environment with no limit at all. Backed by the spring.data.redis connection
            # configured below.
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        - id: advisor-service
          uri: http://advisor-service:7183
          predicates:
            - Path=/api/advisors/**
          filters:
            - StripPrefix=1

        - id: booking-service
          uri: http://booking-service:7184
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=1

        - id: chat-service-rest
          uri: http://chat-service:7185
          predicates:
            - Path=/api/chats/**
          filters:
            - StripPrefix=1

        - id: chat-service-ws
          uri: ws://chat-service:7185
          predicates:
            - Path=/ws/**

        - id: admin-service
          uri: http://admin-service:7186
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://notification-service:7187
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:7379}
      password: ${REDIS_PASSWORD:acredispass}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.advisorconnect: INFO
    org.springframework.cloud.gateway: WARN
